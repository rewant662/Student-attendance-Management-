
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Attendance Manager</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Attendance Manager</h1>
        <p>Track your subject-wise attendance</p>
    </header>

    <main>

        <!-- Dashboard -->
        <section>
            <h2>My Dashboard</h2>

            <div class="cards">

                <div class="card">
                    <h3>Total Classes</h3>
                    <p id="totalClasses">0</p>
                </div>

                <div class="card">
                    <h3>Classes Attended</h3>
                    <p id="attendedClasses">0</p>
                </div>

                <div class="card">
                    <h3>Overall Attendance</h3>
                    <p id="percentage">0%</p>
                </div>

            </div>
        </section>

        <!-- Add Subject -->
        <section>
            <h2>Add Subject</h2>

            <form id="subjectForm">
                <input
                    type="text"
                    id="subjectName"
                    placeholder="Enter subject name"
                    required
                >

                <button type="submit">Add Subject</button>
            </form>
        </section>

        <!-- Mark Attendance -->
        <section>
            <h2>Mark Attendance</h2>

            <form id="attendanceForm">

                <label for="subjectSelect">Select Subject</label>

                <select id="subjectSelect" required>
                    <option value="">Choose Subject</option>
                </select>

                <label for="attendanceDate">Select Date</label>

                <input
                    type="date"
                    id="attendanceDate"
                    required
                >

                <label for="attendanceStatus">Attendance Status</label>

                <select id="attendanceStatus">
                    <option value="Present">Present</option>
                    <option value="Absent">Absent</option>
                </select>

                <button type="submit">Save Attendance</button>

            </form>
        </section>

        <!-- Subject Report -->
        <section>
            <h2>Subject-wise Attendance</h2>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Subject</th>
                            <th>Total Classes</th>
                            <th>Present</th>
                            <th>Percentage</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="subjectList"></tbody>
                </table>
            </div>
        </section>

        <!-- Attendance History -->
        <section>
            <h2>Attendance History</h2>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Subject</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="attendanceHistory"></tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
